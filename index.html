<!-- =========================================================
     A-10 C.O. RESEARCH LABS — ENTRY GATE + INTRO
     Reemplaza SOLO tu bloque actual de entrada/intro por este.
     ========================================================= -->

<style>
  /* ===== ENTRY / INTRO OVERLAY ===== */

  #a10-entry-overlay,
  #a10-intro-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(
        circle at center,
        rgba(0, 84, 130, 0.17) 0%,
        rgba(3, 17, 30, 0.96) 44%,
        #01060c 100%
      );
  }

  #a10-entry-overlay::before,
  #a10-intro-overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      radial-gradient(circle at 10% 13%, rgba(52, 220, 255, 0.8) 0 1px, transparent 1.7px),
      radial-gradient(circle at 43% 31%, rgba(52, 220, 255, 0.6) 0 1px, transparent 1.7px),
      radial-gradient(circle at 68% 18%, rgba(52, 220, 255, 0.45) 0 1px, transparent 1.7px),
      radial-gradient(circle at 24% 67%, rgba(52, 220, 255, 0.55) 0 1px, transparent 1.7px),
      radial-gradient(circle at 74% 70%, rgba(52, 220, 255, 0.45) 0 1px, transparent 1.7px),
      radial-gradient(circle at 50% 85%, rgba(52, 220, 255, 0.38) 0 1px, transparent 1.7px);
  }

  #a10-entry-overlay.is-hidden,
  #a10-intro-overlay.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #a10-entry-overlay {
    transition:
      opacity 0.45s ease,
      visibility 0.45s ease;
  }

  #a10-intro-overlay {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
      opacity 0.5s ease,
      visibility 0.5s ease;
  }

  #a10-intro-overlay.is-active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  /* ===== ENTER BUTTON ===== */

  #a10-enter-button {
    position: relative;
    z-index: 2;
    min-width: 360px;
    padding: 18px 34px;
    border-radius: 999px;
    border: 1.5px solid rgba(62, 222, 255, 0.72);

    background:
      linear-gradient(
        180deg,
        rgba(5, 21, 35, 0.90),
        rgba(3, 12, 24, 0.92)
      );

    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2.8px;
    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
      0 0 10px rgba(31, 199, 255, 0.18),
      inset 0 0 18px rgba(31, 199, 255, 0.03);

    transition:
      transform 0.28s ease,
      border-color 0.28s ease,
      box-shadow 0.28s ease,
      background 0.28s ease;
  }

  #a10-enter-button::before {
    content: "";
    position: absolute;
    inset: -20px;
    border-radius: 999px;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 213, 255, 0.16),
      transparent 68%
    );
    opacity: 0;
    filter: blur(12px);
    transition: opacity 0.28s ease;
    pointer-events: none;
    z-index: -1;
  }

  #a10-enter-button:hover,
  #a10-enter-button:focus-visible {
    transform: scale(1.035);
    border-color: rgba(118, 242, 255, 1);

    background:
      linear-gradient(
        180deg,
        rgba(7, 28, 47, 0.96),
        rgba(3, 15, 29, 0.96)
      );

    box-shadow:
      0 0 12px rgba(54, 225, 255, 0.55),
      0 0 34px rgba(54, 225, 255, 0.28),
      0 0 70px rgba(54, 225, 255, 0.14);
  }

  #a10-enter-button:hover::before,
  #a10-enter-button:focus-visible::before {
    opacity: 1;
  }

  /* ===== INTRO VIDEO ===== */

  #a10-intro-shell {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;
  }

  #a10-intro-video {
    display: block;

    width: 30vw;
    max-width: 620px;
    min-width: 420px;

    height: auto;
    max-height: 62vh;

    object-fit: contain;

    background: transparent;

    box-shadow: none;
    border: 0;
    outline: 0;
  }

  /* No controles visibles */
  #a10-intro-video::-webkit-media-controls {
    display: none !important;
  }

  /* ===== MOBILE ===== */

  @media (max-width: 768px) {
    #a10-enter-button {
      width: calc(100vw - 48px);
      min-width: 0;

      padding: 20px 22px;

      font-size: 11px;
      letter-spacing: 2px;
    }

    #a10-intro-video {
      width: 84vw;
      max-width: none;
      min-width: 0;
      max-height: 55vh;
    }
  }

  @media (max-width: 430px) {
    #a10-enter-button {
      width: calc(100vw - 42px);
      font-size: 10px;
      letter-spacing: 1.7px;
    }

    #a10-intro-video {
      width: 88vw;
    }
  }
</style>


<!-- ENTRY SCREEN -->
<div id="a10-entry-overlay">
  <button
    id="a10-enter-button"
    type="button"
    aria-label="Enter A-10 C.O. Research Labs"
  >
    ENTER A-10 C.O. RESEARCH LABS
  </button>
</div>


<!-- INTRO VIDEO SCREEN -->
<div
  id="a10-intro-overlay"
  class="is-hidden"
  aria-hidden="true"
>
  <div id="a10-intro-shell">

    <video
      id="a10-intro-video"
      playsinline
      webkit-playsinline
      preload="auto"
      muted
      disablepictureinpicture
    >
      <source
        src="a10co-research-labs-intro.mp4"
        type="video/mp4"
      >
    </video>

  </div>
</div>


<script>
  (() => {
    const entryOverlay = document.getElementById("a10-entry-overlay");
    const enterButton = document.getElementById("a10-enter-button");

    const introOverlay = document.getElementById("a10-intro-overlay");
    const introVideo = document.getElementById("a10-intro-video");

    /*
      CAMBIA SOLO ESTO si tu audio usa otro ID.

      Tu botón de música ya funciona, así que NO vamos a reescribir
      esa lógica. Aquí solo intentamos arrancar el audio existente
      después del gesto del usuario.

      IDs contemplados:
      - ambientAudio
      - bgMusic
      - backgroundMusic
      - siteMusic
      - music
    */
    const existingMusic =
      document.getElementById("ambientAudio") ||
      document.getElementById("bgMusic") ||
      document.getElementById("backgroundMusic") ||
      document.getElementById("siteMusic") ||
      document.getElementById("music");

    let introFinished = false;


    /* ========================================
       ESTADO INICIAL
       ======================================== */

    function resetEntryState() {
      introFinished = false;

      entryOverlay.classList.remove("is-hidden");

      introOverlay.classList.add("is-hidden");
      introOverlay.classList.remove("is-active");
      introOverlay.setAttribute("aria-hidden", "true");

      try {
        introVideo.pause();
        introVideo.currentTime = 0;
      } catch (error) {
        console.warn("A-10 intro reset:", error);
      }

      /*
        Evita restauración visual del navegador
        al volver desde historial / bfcache.
      */
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
    }


    /* ========================================
       MOSTRAR INTRO
       ======================================== */

    function showIntro() {
      entryOverlay.classList.add("is-hidden");

      introOverlay.classList.remove("is-hidden");

      requestAnimationFrame(() => {
        introOverlay.classList.add("is-active");
        introOverlay.setAttribute("aria-hidden", "false");
      });
    }


    /* ========================================
       ENTRAR A LA WEB
       ======================================== */

    function finishIntro() {
      if (introFinished) return;

      introFinished = true;

      introOverlay.classList.remove("is-active");
      introOverlay.setAttribute("aria-hidden", "true");

      setTimeout(() => {
        introOverlay.classList.add("is-hidden");

        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";

        /*
          Arranca el audio existente.
          NO cambia tu botón ni tu sistema mute/unmute.
        */
        if (existingMusic) {
          existingMusic.volume = existingMusic.volume || 0.45;

          existingMusic.play().catch(() => {
            /*
              Si Safari no lo deja aquí, tu botón de audio
              seguirá funcionando como ya funciona actualmente.
            */
          });
        }

        /*
          Si tienes videos en loop en la página, esta parte
          intenta activarlos sin modificar tu HTML.
        */
        document
          .querySelectorAll(
            'video[loop], video[data-loop], .loop-video, #atenciaConceptVideo'
          )
          .forEach(video => {

            if (video === introVideo) return;

            video.loop = true;
            video.playsInline = true;

            /*
              Los navegadores exigen muted para autoplay.
              Si el video tiene audio propio y lo quieres escuchar,
              elimina esta línea.
            */
            video.muted = true;

            video.play().catch(() => {});
          });

      }, 500);
    }


    /* ========================================
       CLICK ENTER
       ======================================== */

    enterButton.addEventListener("click", async () => {
      showIntro();

      /*
        El intro va muteado.
        Esto maximiza compatibilidad iPhone / Safari / Chrome.
      */
      introVideo.muted = true;
      introVideo.playsInline = true;

      try {
        introVideo.currentTime = 0;

        const playPromise = introVideo.play();

        if (playPromise !== undefined) {
          await playPromise;
        }

      } catch (error) {
        console.warn(
          "A-10 intro could not start:",
          error
        );

        /*
          No dejamos al usuario atrapado.
        */
        setTimeout(finishIntro, 900);
      }
    });


    /* ========================================
       CUANDO TERMINA EL VIDEO
       ======================================== */

    introVideo.addEventListener("ended", finishIntro);


    /* ========================================
       ERROR REAL DE VIDEO
       ======================================== */

    introVideo.addEventListener("error", () => {
      console.warn(
        "A-10 intro file could not be decoded or loaded."
      );

      setTimeout(finishIntro, 1000);
    });


    /*
      Si el navegador cargó metadata pero no avanza,
      evitamos cuadro negro eterno.

      12 segundos es solo fail-safe.
      Si tu intro dura más, aumenta este número.
    */
    let playbackWatchdog;

    introVideo.addEventListener("playing", () => {
      clearTimeout(playbackWatchdog);

      playbackWatchdog = setTimeout(() => {

        if (
          !introFinished &&
          (
            introVideo.paused ||
            introVideo.readyState < 2
          )
        ) {
          finishIntro();
        }

      }, 12000);
    });


    /* ========================================
       BFCACHE / BACK / REFRESH
       ======================================== */

    window.addEventListener("pageshow", event => {
      /*
        Si Safari o Chrome restauran la página desde cache,
        volvemos a mostrar ENTER.
      */
      if (event.persisted) {
        resetEntryState();
      }
    });


    /*
      Inicio limpio siempre.
    */
    resetEntryState();
  })();
</script>
